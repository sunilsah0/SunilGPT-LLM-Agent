<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root { --bg:#faf9f5; --panel:#fff; --text:#1f1e1d; --muted:#73726c; --accent:#c96442; --user:#f0eee6; --border:#e5e3da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#262624; --panel:#30302e; --text:#f0eee6; --muted:#a09f98; --user:#3a3a37; --border:#444441; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 12px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin: 16px 0; line-height: 1.6; }
  .msg.user { background: var(--user); padding: 10px 14px; border-radius: 12px; width: fit-content; max-width: 85%; margin-left: auto; white-space: pre-wrap; }
  .msg.assistant pre { background: var(--panel); border: 1px solid var(--border); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .msg.assistant code { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; }
  .msg.assistant table { border-collapse: collapse; }
  .msg.assistant td, .msg.assistant th { border: 1px solid var(--border); padding: 4px 8px; }
  #empty { text-align: center; color: var(--muted); margin-top: 20vh; }
  footer { padding: 12px 20px 20px; }
  #box { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px; }
  textarea { flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--text); font: inherit; max-height: 160px; padding: 6px; }
  #send { background: var(--accent); color: #fff; border: none; }
</style>
</head>
<body>
<header>
  <h1>My AI Chat</h1>
  <button id="new">New chat</button>
</header>
<div id="chat"><div class="wrap" id="msgs"><div id="empty">How can I help you today?</div></div></div>
<footer>
  <div id="box">
    <textarea id="input" rows="1" placeholder="Type your message... (Enter to send, Shift+Enter for new line)"></textarea>
    <button id="send">Send</button>
  </div>
</footer>

<script>
const msgsEl = document.getElementById("msgs");
const chatEl = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

let messages = [];      // the whole conversation: [{role, content}, ...]
let controller = null;  // lets us stop a reply in progress

// Load the saved chat from the browser (if any)
try { messages = JSON.parse(localStorage.getItem("chat") || "[]"); } catch (e) { messages = []; }

function save() {
  try { localStorage.setItem("chat", JSON.stringify(messages)); } catch (e) {}
}

function render(el, role, text) {
  if (role === "assistant") {
    el.innerHTML = DOMPurify.sanitize(marked.parse(text)); // safe Markdown
  } else {
    el.textContent = text;
  }
}

function addBubble(role, text) {
  document.getElementById("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  render(el, role, text);
  msgsEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
  return el;
}

messages.forEach(m => addBubble(m.role, m.content));

async function send() {
  if (controller) { controller.abort(); return; } // the button works as Stop
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  input.style.height = "auto";

  messages.push({ role: "user", content: text });
  addBubble("user", text);
  const bubble = addBubble("assistant", "…");

  controller = new AbortController();
  sendBtn.textContent = "Stop";
  let reply = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error("Server error " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      reply += decoder.decode(value, { stream: true });
      render(bubble, "assistant", reply);   // text appears word by word
      chatEl.scrollTop = chatEl.scrollHeight;
    }
  } catch (e) {
    if (e.name !== "AbortError") reply += "\n\n⚠️ Something went wrong. Please try again.";
    render(bubble, "assistant", reply || "…");
  }

  if (reply) messages.push({ role: "assistant", content: reply });
  else messages.pop(); // nothing came back, so remove the user message
  save();
  controller = null;
  sendBtn.textContent = "Send";
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
});
document.getElementById("new").addEventListener("click", () => {
  messages = []; save();
  msgsEl.innerHTML = '<div id="empty">How can I help you today?</div>';
});
</script>
</body>
</html>
