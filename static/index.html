<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SunilGPT-LLMChat</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root { --bg:#faf9f5; --panel:#fff; --side:#f3f1ea; --text:#1f1e1d; --muted:#73726c; --accent:#c96442; --user:#f0eee6; --border:#e5e3da; --hover:#e9e6dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#262624; --panel:#30302e; --side:#1f1e1d; --text:#f0eee6; --muted:#a09f98; --user:#3a3a37; --border:#444441; --hover:#30302e; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
  #app { display: flex; height: 100%; }

  /* login screen */
  #auth { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
  #authbox { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
  #authbox h2 { margin: 0 0 6px; text-align: center; }
  #authbox input { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  #authmsg { color: var(--accent); font-size: 14px; min-height: 18px; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; padding: 10px; }

  /* sidebar */
  #side { width: 260px; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px; gap: 10px; }
  #new { background: var(--accent); color: #fff; border: none; padding: 10px; }
  #list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .item:hover { background: var(--hover); }
  .item.active { background: var(--hover); font-weight: 600; }
  .item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item button { border: none; background: transparent; color: var(--muted); padding: 0 4px; font-size: 16px; }
  #who { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu { display: none; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 12px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin: 16px 0; line-height: 1.6; }
  .msg.user { background: var(--user); padding: 10px 14px; border-radius: 12px; width: fit-content; max-width: 85%; margin-left: auto; white-space: pre-wrap; }
  .msg.assistant pre { background: var(--panel); border: 1px solid var(--border); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .msg.assistant code { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; }
  .msg.assistant table { border-collapse: collapse; }
  .msg.assistant td, .msg.assistant th { border: 1px solid var(--border); padding: 4px 8px; }
  .actions { display: flex; gap: 6px; margin-top: 6px; }
  .actions button { font-size: 12px; padding: 2px 8px; color: var(--muted); }
  #empty { text-align: center; color: var(--muted); margin-top: 20vh; }
  footer { padding: 12px 20px 20px; }
  #box { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px; }
  textarea { flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--text); font: inherit; max-height: 160px; padding: 6px; }
  #send { background: var(--accent); color: #fff; border: none; }
  

    #docs { max-width: 760px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--user); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 13px; }
  .chip button { border: none; background: transparent; color: var(--muted); padding: 0 6px; }
  #attach { border: none; background: transparent; font-size: 18px; padding: 4px 8px; }
  #docstatus { max-width: 760px; margin: 0 auto 6px; font-size: 13px; color: var(--muted); }
  @media (max-width: 700px) {
    #side { position: fixed; z-index: 10; top: 0; bottom: 0; left: 0; transform: translateX(-100%); transition: transform 0.2s; }
    #side.open { transform: translateX(0); }
    #menu { display: inline-block; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN (hidden after login) -->
<div id="auth">
  <div id="authbox">
    <h2>SunilGPT-LLMChat</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
    <div id="authmsg"></div>
    <div class="row">
      <button id="login">Log in</button>
      <button id="signup">Sign up</button>
    </div>
  </div>
</div>

<div id="app">
  <aside id="side">
    <button id="new">+ New chat</button>
    <div id="list"></div>
    <div id="who"></div>
    <button id="logout">Log out</button>
  </aside>
  <div id="main">
    <header>
      <button id="menu">☰</button>
      <h1 id="title">My AI Chat</h1>
    </header>
    <div id="chat"><div class="wrap" id="msgs"></div></div>
        <footer>
      <div id="docstatus"></div>
      <div id="docs"></div>
      <div id="box">
        <button id="attach" title="Attach a PDF, .txt or .md file">📎</button>
        <input id="file" type="file" accept=".pdf,.txt,.md" hidden>
        <textarea id="input" rows="1" placeholder="Type your message... (Enter to send, Shift+Enter for new line)"></textarea>
        <button id="send">Send</button>
      </div>
    </footer>
  </div>
</div>

<script>
// ===== PASTE YOUR TWO SUPABASE VALUES HERE (they are safe to be public) =====
const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL";
const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY";
// ===========================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const msgsEl = $("msgs"), chatEl = $("chat"), input = $("input");
const sendBtn = $("send"), listEl = $("list"), titleEl = $("title"), side = $("side");

let chats = [];          // all chats of the logged-in user
let currentId = "";
let controller = null;   // lets us stop a reply in progress

const current = () => chats.find(c => c.id === currentId);

// ---------- saving to the database ----------
async function persist(c) {
  if (!c.messages.length) return; // empty chats are not saved
  const { error } = await sb.from("chats").upsert({
    id: c.id,
    title: c.title,
    messages: c.messages,
    docs: c.docs || [],
    updated_at: new Date().toISOString(),
  });
  if (error) console.error("Save failed:", error.message);
}

function ensureChat() {
  if (current()) return;
  if (chats.length) { currentId = chats[0].id; return; }
  const c = { id: crypto.randomUUID(), title: "New chat", messages: [] };
  chats.unshift(c);
  currentId = c.id;
}

// ---------- drawing things on the screen ----------
function render(el, role, text) {
  if (role === "assistant") el.innerHTML = DOMPurify.sanitize(marked.parse(text));
  else el.textContent = text;
}

function addBubble(role, text) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  render(el, role, text);
  msgsEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
  return el;
}

function renderSidebar() {
  listEl.innerHTML = "";
  chats.forEach(c => {
    const row = document.createElement("div");
    row.className = "item" + (c.id === currentId ? " active" : "");
    const name = document.createElement("span");
    name.textContent = c.title;
    const x = document.createElement("button");
    x.textContent = "×";
    x.title = "Delete chat";
    x.onclick = e => { e.stopPropagation(); removeChat(c.id); };
    row.onclick = () => switchTo(c.id);
    row.append(name, x);
    listEl.appendChild(row);
  });
}

function decorate() {
  const c = current();
  msgsEl.querySelectorAll(".actions").forEach(a => a.remove());
  const bubbles = [...msgsEl.querySelectorAll(".msg.assistant")];
  bubbles.forEach((b, k) => {
    const i = +b.dataset.i;
    if (isNaN(i)) return;
    const bar = document.createElement("div");
    bar.className = "actions";

    const copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.onclick = () => {
      navigator.clipboard.writeText(c.messages[i].content);
      copy.textContent = "Copied!";
      setTimeout(() => (copy.textContent = "Copy"), 1200);
    };
    bar.appendChild(copy);

    if (k === bubbles.length - 1 && i === c.messages.length - 1) {
      const regen = document.createElement("button");
      regen.textContent = "Regenerate";
      regen.onclick = () => {
        if (controller) return;
        c.messages.pop();
        renderMessages();
        ask(c);
      };
      bar.appendChild(regen);
    }
    b.appendChild(bar);
  });
}

function renderMessages() {
  const c = current();
  renderDocs();
  msgsEl.innerHTML = "";
  titleEl.textContent = c.title;
  if (!c.messages.length) {
    msgsEl.innerHTML = '<div id="empty">How can I help you today?</div>';
    return;
  }
  c.messages.forEach((m, i) => { addBubble(m.role, m.content).dataset.i = i; });
  decorate();
}

function renderAll() { renderSidebar(); renderMessages(); }

// ---------- chat actions ----------
function newChat() {
  if (controller) controller.abort();
  const c = current();
  if (c && !c.messages.length) { input.focus(); return; }
  const n = { id: crypto.randomUUID(), title: "New chat", messages: [] };
  chats.unshift(n);
  currentId = n.id;
  renderAll(); side.classList.remove("open"); input.focus();
}

function switchTo(id) {
  if (controller) controller.abort();
  currentId = id;
  renderAll(); side.classList.remove("open");
}

async function removeChat(id) {
  if (!confirm("Delete this chat?")) return;
  if (controller) controller.abort();
  chats = chats.filter(c => c.id !== id);
  if (id === currentId) currentId = "";
  ensureChat();
  renderAll();
  const { error } = await sb.from("chats").delete().eq("id", id);
  if (error) console.error("Delete failed:", error.message);
}

// ---------- talking to the server ----------
async function ask(c) {
  const bubble = addBubble("assistant", "…");
  controller = new AbortController();
  sendBtn.textContent = "Stop";
  let reply = "";

  try {
    // get the login token (supabase refreshes it automatically if needed)
    const { data } = await sb.auth.getSession();
    const token = data.session ? data.session.access_token : "";

    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ messages: c.messages, documents: c.docs || [] }),
      signal: controller.signal,
    });
    if (res.status === 401) throw new Error("login");
    if (res.status === 429) throw new Error("slow");
    if (!res.ok) throw new Error("Server error " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      reply += decoder.decode(value, { stream: true });
      render(bubble, "assistant", reply);
      chatEl.scrollTop = chatEl.scrollHeight;
    }
  } catch (e) {
    if (e.name !== "AbortError") {
      if (e.message === "login") reply += "\n\n⚠️ Your login expired. Please refresh the page and log in again.";
      else if (e.message === "slow") reply += "\n\n⚠️ You are sending messages too fast. Please wait a minute.";
      else reply += "\n\n⚠️ Something went wrong. Please try again.";
    }
    render(bubble, "assistant", reply || "…");
  }

  if (reply) {
    c.messages.push({ role: "assistant", content: reply });
    bubble.dataset.i = c.messages.length - 1;
  }
  controller = null;
  sendBtn.textContent = "Send";
  if (c.id === currentId) decorate();
  persist(c);
}

function send() {
  if (controller) { controller.abort(); return; }
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  input.style.height = "auto";

  const c = current();
  if (!c.messages.length) c.title = text.slice(0, 40);
  c.messages.push({ role: "user", content: text });
  chats.splice(chats.indexOf(c), 1);
  chats.unshift(c);
  addBubble("user", text);
  titleEl.textContent = c.title;
  renderSidebar();
  persist(c);
  ask(c);
}

// ---------- login ----------
async function doAuth(mode) {
  const email = $("email").value.trim();
  const password = $("password").value;
  const msg = $("authmsg");
  msg.textContent = "";
  if (!email || password.length < 6) {
    msg.textContent = "Enter your email and a password of at least 6 characters.";
    return;
  }
  const { data, error } = mode === "signup"
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  if (error) { msg.textContent = error.message; return; }
  if (data.session) startApp(data.session);
  else msg.textContent = "Account created. Check your email and click the confirmation link, then log in.";
}

// chats saved in this browser by Phase 3 can be moved into the account (asked once)
async function importOld() {
  if (localStorage.getItem("import-asked")) return;
  let old = [];
  try { old = JSON.parse(localStorage.getItem("chats-v1") || "[]"); } catch (e) {}
  old = old.filter(c => c.messages && c.messages.length);
  localStorage.setItem("import-asked", "1");
  if (!old.length) return;
  if (!confirm("Found " + old.length + " chat(s) saved in this browser. Add them to your account?")) return;
  for (const o of old) {
    const c = { id: crypto.randomUUID(), title: o.title, messages: o.messages };
    chats.push(c);
    await persist(c);
  }
}

async function startApp(session) {
  $("auth").style.display = "none";
  $("who").textContent = session.user.email;
  const { data, error } = await sb.from("chats")
    .select("id,title,messages,docs")
    .order("updated_at", { ascending: false });
  if (error) alert("Could not load your chats: " + error.message);
  chats = data || [];
  await importOld();
  currentId = "";
  ensureChat();
  renderAll();
}
// ---------- documents (PDF, .txt, .md) ----------
const MAX_TOTAL = 250000; // total characters of documents per chat

function toBase64(buf) {
  let s = "";
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 0x8000) {
    s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(s);
}

function renderDocs() {
  const c = current();
  const box = $("docs");
  box.innerHTML = "";
  (c.docs || []).forEach((d, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = "📄 " + d.name;
    const x = document.createElement("button");
    x.textContent = "×";
    x.title = "Remove file";
    x.onclick = () => { c.docs.splice(i, 1); renderDocs(); persist(c); };
    chip.appendChild(x);
    box.appendChild(chip);
  });
}

async function addDocument(file) {
  const c = current();
  c.docs = c.docs || [];
  if (c.docs.length >= 5) { alert("Maximum 5 files per chat."); return; }
  if (file.size > 5 * 1024 * 1024) { alert("File is too big (maximum 5 MB)."); return; }

  $("docstatus").textContent = "Reading " + file.name + "...";
  try {
    let text = "";
    if (/\.pdf$/i.test(file.name)) {
      const { data } = await sb.auth.getSession();
      const res = await fetch("/api/extract", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + data.session.access_token,
        },
        body: JSON.stringify({ filename: file.name, data: toBase64(await file.arrayBuffer()) }),
      });
      const out = await res.json();
      if (!res.ok) throw new Error(out.detail || "Could not read the PDF");
      text = out.text;
    } else {
      text = await file.text();
    }
    if (!text.trim()) throw new Error("No text found. Scanned PDFs (pictures of pages) are not supported.");
    const total = c.docs.reduce((n, d) => n + d.text.length, 0);
    if (total + text.length > MAX_TOTAL) throw new Error("Too much text. Try a smaller file.");
    c.docs.push({ name: file.name, text });
    renderDocs();
    persist(c);
  } catch (e) {
    alert(e.message);
  }
  $("docstatus").textContent = "";
}

$("attach").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (file) await addDocument(file);
});
// ---------- buttons and keys ----------
sendBtn.addEventListener("click", send);
$("new").addEventListener("click", newChat);
$("menu").addEventListener("click", () => side.classList.toggle("open"));
$("login").addEventListener("click", () => doAuth("login"));
$("signup").addEventListener("click", () => doAuth("signup"));
$("password").addEventListener("keydown", e => { if (e.key === "Enter") doAuth("login"); });
$("logout").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
});

// ---------- start: already logged in? ----------
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) startApp(data.session);
})();
</script>
</body>
</html>
